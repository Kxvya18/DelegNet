# DelegNet — full paper configuration (real on-chain data only).
# Endpoints are routed per JSON-RPC method; put a paid archive endpoint first when you have one,
# e.g. export ETH_RPC=https://eth-mainnet.g.alchemy.com/v2/<key>  and reference it as ${ETH_RPC}.

data_root: data/full        # keep data outside cloud-synced folders; override with DELEGNET_DATA_ROOT
run_root: runs

collect:
  concurrency: 12
  scan_chunk: 2000           # blocks per scan file
  activity_block_chunk: 5000
  activity_addr_chunk: 25
  hop2_limit: 2000           # candidate sinks / sponsor funders to expand
  scan_root: data            # full type-4 scan (all authorizations); override with DELEGNET_SCAN_ROOT
  per_contract_cap: 1000     # stratified sample for activity collection

chains:
  ethereum:
    chain_id: 1
    token_logs: false      # set true once ETH_RPC (paid/archive, wide eth_getLogs ranges) is exported
    start_time: "2025-05-07T10:05:00Z"   # Pectra activation (EIP-7702 live)
    end_time:   "2025-07-07T00:00:00Z"
    endpoints:
      default: ["${ETH_RPC}", "https://ethereum-rpc.publicnode.com"]
      eth_getBlockByNumber:batch: ["${ETH_RPC}", "https://ethereum-rpc.publicnode.com", "https://1rpc.io/eth",
                                   "https://eth-mainnet.public.blastapi.io", "https://rpc.mevblocker.io"]
      eth_getLogs: ["${ETH_RPC}", "https://1rpc.io/eth", "https://eth-mainnet.public.blastapi.io"]
      trace_filter: ["${ETH_RPC}", "https://eth.drpc.org"]
      eth_getTransactionByHash: ["${ETH_RPC}", "https://ethereum-rpc.publicnode.com", "https://eth.drpc.org"]
      eth_getTransactionByHash:batch: ["${ETH_RPC}", "https://ethereum-rpc.publicnode.com", "https://1rpc.io/eth",
                                       "https://eth-mainnet.public.blastapi.io", "https://rpc.mevblocker.io"]
  base:
    chain_id: 8453
    token_logs: false
    start_time: "2025-05-09T20:00:00Z"   # Isthmus (EIP-7702 on Base)
    end_time:   "2025-05-16T20:00:00Z"   # 7 days: cross-chain test set
    endpoints:
      default: ["${BASE_RPC}", "https://mainnet.base.org", "https://base-mainnet.public.blastapi.io"]
      eth_getBlockByNumber:batch: ["${BASE_RPC}", "https://mainnet.base.org", "https://base-mainnet.public.blastapi.io"]
      eth_getTransactionByHash:batch: ["${BASE_RPC}", "https://mainnet.base.org", "https://base-mainnet.public.blastapi.io"]
      trace_filter: ["${BASE_RPC}", "https://base.drpc.org"]
  bsc:
    chain_id: 56
    token_logs: false
    start_time: "2025-03-20T00:00:00Z"   # Pascal (EIP-7702 on BSC)
    end_time:   "2025-03-27T00:00:00Z"   # 7 days: cross-chain test set
    endpoints:
      default: ["${BSC_RPC}", "https://bsc-rpc.publicnode.com", "https://bsc-dataseed.bnbchain.org"]
      eth_getBlockByNumber:batch: ["${BSC_RPC}", "https://bsc-rpc.publicnode.com", "https://bsc-dataseed.bnbchain.org",
                                   "https://bsc-mainnet.public.blastapi.io"]
      eth_getTransactionByHash:batch: ["${BSC_RPC}", "https://bsc-rpc.publicnode.com", "https://bsc-dataseed.bnbchain.org",
                                       "https://bsc-mainnet.public.blastapi.io"]
      trace_filter: ["${BSC_RPC}", "https://bsc.drpc.org"]
  # arbitrum: dropped — trace_filter is not available on any free plan (needed for internal sweeps)

labels:
  # Optional curated lists (address,source,name). They override behavioural labels.
  malicious_lists: ["labels/malicious_delegates.csv"]
  benign_lists: ["labels/benign_delegates.csv"]
  # public scammer-address lists, used only as an independent check of our labels
  scam_address_lists: ["labels/scam_addresses.csv"]
  min_drained_authorities: 3     # contract-level evidence for "malicious"
  min_drained_ratio: 0.02        # sweepers only fire when funds arrive; most victim wallets are empty
  max_malicious_self_active: 0.2 # owners of compromised/phished accounts stop transacting themselves
  min_shared_sink_ratio: 0.6
  min_sink_event_share: 0.8      # third-party outflows must concentrate in shared EOA sinks
  min_benign_authorities: 5
  max_benign_drained_ratio: 0.05
  min_benign_self_active: 0.3
  drain_window_s: 86400          # outflows within 24h of delegation count as drain evidence

graph:
  k1: 24                 # most recent events per centre node
  k2: 8                  # per 1-hop neighbour
  max_nodes: 256
  max_siblings: 256      # earlier delegators of the same contract considered by the motif counter
  motif_delta_s: 3600

experiment:
  source_chain: ethereum
  target_chains: []              # needs per-address explorer data for Base/BSC (free trace_filter is unusable there)
  checkpoints_s: [0, 12, 60, 300, 1800, 7200]
  train_checkpoints_s: [0, 60, 300]
  split: [0.6, 0.2, 0.2]          # temporal train/val/test
  heldout_family_frac: 0.25       # family-disjoint protocol
  target_fpr: 0.01
  few_shot_k: [10, 50]
  seeds: [0, 1, 2]                # 3 seeds keeps the full run within a day on one Mac GPU
  zeroday_folds: 3
  # zero-day is the headline result: main methods with 3 seeds; ablations with 1 seed
  methods_zeroday: [HashBlocklist, OpcodeKNN, XGBoost, GraphSAGE, TGAT, DelegNet]
  seeds_zeroday_ablation: [0]
  methods_zeroday_ablation: [DelegNet-noGate, DelegNet-noCodeExpert, DelegNet-noMemory, DelegNet-noEvidenceDropout,
                             DelegNet-noProto]
  seeds_temporal: [0]
  methods_temporal: [HashBlocklist, OpcodeKNN, XGBoost, GraphSAGE, TGAT, DelegNet]
  seeds_family: [0]
  methods_family: [HashBlocklist, OpcodeKNN, XGBoost, TGAT, DelegNet]
  seeds_crosschain: [0]
  methods_crosschain: [HashBlocklist, OpcodeKNN, XGBoost, TGAT, DelegNet]
  mutation_strengths: [0, 0.5, 1, 2, 4]

tuning:                          # equal budget per method, validation families only
  methods: [DelegNet, TGAT, GraphSAGE, XGBoost]
  trials: 6
  epoch_samples: 3000
  epochs: 15

model:
  dim: 128
  heads: 4
  layers: 2
  dropout: 0.1
  code_len: 512
  code_dim: 128              # pre-trained code encoder width (fixed; `dim` is tuned)
  code_layers: 2
  prototypes_per_class: 10
  lr: 0.001
  weight_decay: 0.0001
  epochs: 25                 # cap only; early stopping on validation loss decides
  patience: 3
  batch_size: 64
  epoch_samples: 6000         # contract-balanced draws per epoch
  evidence_dropout: 0.5       # share of training rows seen as first victims (sibling evidence hidden)
  lambda_cluster: 0.05
  lambda_sep: 0.01
  lambda_div: 0.01
  pretrain_epochs: 30
  device: cpu            # Apple-GPU (mps) training hangs under the macOS GPU watchdog; cuda also works
